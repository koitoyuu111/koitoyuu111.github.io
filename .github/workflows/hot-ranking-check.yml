name: Update Post Views

on:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 = Beijing 00:00
  workflow_dispatch:

concurrency:
  group: post-views-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch per-post PV from busuanzi
        id: fetch
        shell: bash
        run: |
          node scripts/update-post-views.mjs

          CURRENT_TOP5=$(jq -r '.[0:5] | map(.slug) | join(",")' src/data/post-views.json)
          echo "current=${CURRENT_TOP5}" >> "$GITHUB_OUTPUT"
          echo "Current Top 5: ${CURRENT_TOP5}"

          CACHE_FILE=".hot-ranking-cache.txt"
          if [ -f "$CACHE_FILE" ] && [ "$(cat "$CACHE_FILE")" = "$CURRENT_TOP5" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ranking unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Ranking changed"
          fi

      - name: Commit and push
        run: |
          echo "${{ steps.fetch.outputs.current }}" > .hot-ranking-cache.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post-views.json .hot-ranking-cache.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update post views data"
          git pull --rebase origin main
          git push origin HEAD:main
